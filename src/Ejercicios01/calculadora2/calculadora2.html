<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora</title>
  </head>
  <body>
    <h1>Calculadora de dos números</h1>
    <form action="calculadora2.php" method="POST">
      <label for="num1">Primer número</label>
      <input type="number" step="any" id="num1" name="num1" required />
      <br /><br />
      <label for="num2">Segundo número</label>
      <input type="number" step="any" id="num2" name="num2" required />
      <br /><br />
      <label for="operacion">Operación:</label>
      <select id="operacion" name="operacion" required>
        <option value="">Seleccione la operación</option>
        <option value="sumar">Sumar</option>
        <option value="restar">Restar</option>
        <option value="multiplicar">Multiplicar</option>
        <option value="dividir">Dividir</option>
      </select>
      <br /><br />
      <input type="submit" value="Calcular" />
    </form>
  </body>
</html>
