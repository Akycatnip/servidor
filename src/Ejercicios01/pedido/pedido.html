<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido de Bocadillos</title>
  </head>
  <body>
    <h1>Pedido de bocadillos</h1>
    <form action="pedido.php" method="POST">
      <label for="nombre">Nombre: </label>
      <input type="text" id="nombre" name="nombre" required />
      <br /><br />

      <h2>Escoge los bocadillos</h2>

      <label for="tipo">Tipo de bocadillo:</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecciona uno</option>
        <option value="pollo">Pollo</option>
        <option value="tortilla">Tortilla</option>
        <option value="vegetal">Vegetal</option>
      </select>
      <br /><br />

      <label for="cantidad">Cantidad:</label>
      <input
        type="number"
        id="cantidad"
        name="cantidad"
        min="1"
        max="10"
        step="1"
        required
      />

      <h3>Escoge los extras</h3>

      <label>
        <input type="checkbox" name="extras[]" value="queso" />
        Queso
      </label>
      <br />

      <label>
        <input type="checkbox" name="extras[]" value="tomate" />
        Tomate
      </label>
      <br />

      <label>
        <input type="checkbox" name="extras[]" value="salsa" />
        Salsa
      </label>
      <br /><br />

      <button type="submit">Realizar pedido</button>
    </form>
  </body>
</html>
