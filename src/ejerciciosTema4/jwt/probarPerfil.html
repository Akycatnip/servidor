<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Probar perfil</title>
</head>
<body>

<h1>Consultar perfil</h1>

<label>Introduce el token:</label>
<textarea id="token"></textarea>

<button onclick="consultarPerfil()">Consultar</button>

<pre id="resultado"></pre>

<script>
	async function consultarPerfil() {
		
		let token = document.getElementById("token").value;
		
		let respuesta = await fetch("perfil.php", {
			method: "GET",
			headers: {
				"Authorization": "Bearer " + token
			}
		});
		
		let datos = await respuesta.json();
		
		document.getElementById("resultado").textContent =
				JSON.stringify(datos, null, 2);
	}
</script>

</body>
</html>
